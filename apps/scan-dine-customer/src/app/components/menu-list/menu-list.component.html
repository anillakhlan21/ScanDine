<div class="menu-list-layout">
  <div class="menu-list-section">
    <h2 class="menu-title">Menu</h2>
    <p class="menu-subtitle">Discover our delicious dishes and add your favorites to the cart!</p>
    <div class="menu-grid">
      <app-menu-item
        *ngFor="let item of menu"
        [item]="item"
        [quantityInCart]="cartService.getItemQuantity(item.id)"
        (addToCart)="onAdd($event)">
      </app-menu-item>
    </div>
  </div>
  <aside class="cart-summary" *ngIf="cartService.getCart().length > 0">
    <h3>Items in your cart</h3>
    <ul>
      <li *ngFor="let cartItem of cartService.getCart()">
        <span class="cart-item-name">{{ cartItem.name }}</span>
        <span class="cart-item-qty">x{{ cartService.getItemQuantity(cartItem.id) }}</span>
      </li>
    </ul>
    <a routerLink="/checkout" class="view-cart-btn">View Cart & Checkout</a>
  </aside>
</div>
